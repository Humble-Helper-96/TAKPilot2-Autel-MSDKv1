        //        ⚠ THERE IS NO SD RESOLUTION ON THIS CAMERA. The operator asked for one. The
        //        XT706 supported table runs down to 1280*720p24 and has no 720x480. 1080 was
        //        taken above the 720 floor so the footage stays usable as evidence.
        //        ⚠ THE BITRATE IS NOT SETTABLE. VideoEncoderConfiguration reports bitrate,
        //        quality and I-frame interval and the whole aar has no setter for any of them.
        //        Do not look for a bitrate control again.
        //        Written at EVERY camera session, by the operator's requirement, so it survives
        //        a reboot and a swap with Explorer. Refused while recording, and verified by
        //        read-back — getVideoEncoderConfiguration returns codec and resolution together,
        //        and it is a single http request, not a 2 Hz subscription (safety rule 1).
        // v2.1.8 — 2026-09-14. THE APPLICATION FORGOT THE AIRCRAFT WAS RECORDING whenever the
        //        pilot left the flight screen. install() runs from every onResume to reclaim the
        //        SDK's single global listener slot, which makes the SDK re-deliver the current
        //        camera — and the camera-change handler treated every delivery as a NEW camera.
        //        It cleared isRecording, so the REC pill came back dark and a tap on it was
        //        refused because the camera was already recording (operator, in flight).
        //        ⚠ THE WORSE HALF: that handler also re-ran the whole connect sequence INTO A
        //        LIVE RECORDING — media mode, exposure, and the v2.1.7 recording format. Four
        //        times in the first sixty seconds of the flight, on every Home/Flight change.
        //        The v2.1.7 "refused while recording" guard was useless because the flag it
        //        reads had been cleared 9 ms earlier in the same callback.
        //        A re-fire is now detected and returns early, and the recording state is READ
        //        BACK from the camera (getCurrentRecordTime, one call, not a subscription) on
        //        every arm — which also fixes a cold start into an aircraft already recording.
        // v2.1.9 — 2026-09-14. THE CARD RECORDS IN H.264, not H.265 (operator). The codec is
        //        not a size lever on this camera — the CBR target comes from the resolution
        //        alone, so both codecs write 45,000 kbps at 1080p30 and the same bytes a minute.
        //        H.265 was selected in v2.1.7 for a saving that does not exist. At 45 Mbps on
        //        1080p there is nothing left for it to win, and H.264 plays everywhere.
        // v2.2.0 — 2026-09-14. PIP: THE THERMAL IMAGE IN THE CENTRE OF THE VISIBLE IMAGE, drawn by
        //        the camera. A TAP ON THE IR PILL OR THE C1 KEY CYCLES visible → PIP → thermal
        //        (operator). A long-press menu was built first and rejected after one flight:
        //        three views are a cycle, not a menu. The operator's goal was
        //        the IR image overlaid on the RGB image and REGISTERED so the two mesh, at
        //        150 ft AGL. Every fact below was measured on the bench over the camera's own
        //        JSON-RPC API (http://192.168.1.11/camera), each write read back.
        //
        //        ⚠ THE CONTROLLER RECEIVES ONE COMPOSITED STREAM. StreamId 1 is the 1280x720p30
        //        H.264 downlink; there is no second stream to draw. The camera composites, and
        //        this application asks it to — it cannot do it itself.
        //        ⚠ OVERLAP IS REFUSED BY THIS FIRMWARE (XL726 V5.0.6.49): SetDisplayMode Overlap
        //        answers status -1 in every spelling. PictureInPicture answers 0 and reads back.
        //        The SDK enum still has OVERLAP; CameraView maps it to PIP if a camera reports it.
        //        ⚠ PIP IS CENTRED AND SCALED, NOT A CORNER BOX. The thermal picture is drawn into
        //        the centre of the visible frame at the visible lens's angular scale — fence,
        //        trunks and utility boxes inside the window sit on the same objects outside it.
        //        The firmware does NOT register the images by itself: SetIrPosition is a manual
        //        DeltaX/DeltaY trim, clamped by the camera to ±20 px (40 wrote back as 20, -500
        //        as -20), and it read 0,0 with the pictures already lined up. Not written by
        //        this application — it is the camera's own trim. Parallax is not the obstacle
        //        at 150 ft: a few cm of lens baseline at 45 m is one visible pixel.
        //        ⚠ PipBlenderBase decides what fills the window: IR = the thermal picture whole
        //        (chosen); Visible = the colour picture with the thermal EDGES over it as bright
        //        outlines; None = factory. PipBlenderRatio is a 16-bit weight pair, IR FIRST —
        //        Explorer writes IR = pct/100 × 65536, Visible = 65535 − IR. Written at every
        //        connect like the recording format (AutelBlendFormat), read back.
        //        ⚠ WHAT THE CARD WRITES IN PIP: THREE FILES, AND THE FORMAT CHANGES. 11 s in PIP
        //        gave MAX_0004 1280x720p25 H.264 2.9 Mbps, MIX_0004 1280x720p25 7.8 Mbps and
        //        IRX_0004 640x512p25 5.7 Mbps — about 16 Mbps together, 7 GB/h, LESS than the
        //        single 1080p file. Entering PIP switches the record stream to 1280x720p25 at a
        //        30000 target on its own and Visible restores 1920x1080p30; the camera keeps a
        //        configuration per display mode. The v2.1.7 recording-format write is not
        //        changed; its read-back reports the disagreement in PIP and that is correct.
        //        ⚠ THE 1080p H.264 STREAM READS 60000 kbps, NOT 45000. The v2.1.7 ladder was read
        //        under H.265. H.264 costs a third more at 1080p (27 GB/h). Not yet confirmed
        //        from a file; the v2.1.9 claim that the codec is not a size lever is in doubt
        //        in the other direction.
        //        ⚠ IN PIP THE CAMERA REPORTS THE THERMAL FIELD OF VIEW (fov=33.0 on the status
        //        push) OVER THE VISIBLE FRAME, and the bridge published a 33° cone over a 66.8°
        //        picture. A blend now publishes the VISIBLE cone (operator's decision) —
        //        Lens.BLEND and publishedHFov, pinned by LensFovPolicyTest. The CoT carries no
        //        lens tag, only the numbers, so the shared core is untouched.
        //        ⚠ ZOOM IS IGNORED IN PIP AND THE CAMERA SAYS OK: SetZoomFactor 200 answered 0
        //        and read back 100. Refused on the pill and the rocker with the §4.8 notice.
        //        ⚠ THE RECORDING LOCK HOLDS FOR THE VIEW. The camera's own API answers
        //        SetDisplayMode with status -1 while recording, where the SDK path says OK.
        //        SetIrPosition and SetPipBlenderRatio WERE honoured mid-recording, read back.
        //        ⚠ irOn WAS THE WHOLE LENS MODEL AND IS GONE. CameraView (VISIBLE / IR / PIP)
        //        drives the bridge lens, the fill rule and the pill from one setter. Two latent
        //        faults went with it: the connect-time read mapped PIP to VISIBLE (a camera left
        //        in PIP by Explorer got the visible cone over a blend), and the frame-shape
        //        verify was binary, so a PIP write would have been "corrected" back 1.5 s later.
        //        PIP expects the VIDEO shape — CameraViewTest and LensFramePolicyTest pin it.
        //        Stills in PIP were NOT measured (StartTakePhotos needs photo mode).
        //        Unexplained: the camera read IR at 19:38 and Visible at 19:41 with the app on
        //        the home screen. Something wrote it; not found.
        //
        //        ⚠ AR AUDIT, 2026-09-14 — THE OVERLAY WAS "WILDLY OFF" FOR THREE AIRCRAFT, IN
        //        VISIBLE AND IN THERMAL (operator). Ten error sources ranked; the two largest
        //        deterministic ones are FIXED here, both a wrong field-of-view datum:
        //        1. THERMAL VERTICAL FIELD 2.2× TOO WIDE. TakBridgeHolder.currentVFovBase derived
        //           from the CALIBRATED visible horizontal (66.8) while the horizontal followed the
        //           camera (33.0 in thermal), since v1.5.2. Under the 5:4 aspect that gave 55.6°
        //           for a 26.7° lens: every vertical offset drawn 2.2× too small, markers riding
        //           near the horizon, left-right correct. The log printed the tell for a month:
        //           "camera-reported hFov 33.0 (vFov derives to 18.9)" then "video aspect 1.250
        //           -> vFov 55.6 (hFov 66.8)" seconds apart. Now derived from pictureHFovBase.
        //        2. PIP HORIZONTAL FIELD 2.2× TOO NARROW. The v2.2.0 wire fix (publishedHFov)
        //           was not wired to the overlay, which drew a 33° field across the 66.8°
        //           picture. One accessor, pictureHFovBase, now feeds the overlay AND the wire.
        //        Also: ArSettings.saveFov persisted the camera's live figure over the pilot's
        //        calibration whenever an aircraft was attached. It saves the calibrated value.
        //        3. THE PROJECTION TREATED BEARING AND ELEVATION AS INDEPENDENT SCREEN ANGLES —
        //           FIXED. True only at the horizon; at −60° pitch a marker 20° off the heading
        //           landed 10° wrong sideways, zero at the centre, growing outward, invisible to
        //           the crosshair self-test. The target direction is now rotated into the
        //           camera frame first (CameraProjection.kt, pinned by CameraProjectionTest).
        //        4. A PIN WITH NO ELEVATION LANDED AT SEA LEVEL — FIXED. Map tap, restored from
        //           disk, or dropped without DTED coverage all carried 0.0, and once the
        //           aircraft's real MSL was known it was differenced anyway: 60 m deep at a 60 m
        //           field. Unknown is NaN now; an unknown pin sits on the DTED terrain under it
        //           like a ground contact; the CoT gets 9999999 for unknown, never 0.
        //        5. THE FLAT PLANE WHEN NO TAKEOFF REFERENCE LATCHED — FIXED TWO WAYS. The
        //           reference latches from the aircraft's own fix while it sits on the ground,
        //           not only from the home point (which arrives on arming and never on the
        //           bench); and without a reference the DTED under the aircraft stands in for
        //           its MSL, which captures the target-to-aircraft terrain difference and loses
        //           only launch-site-to-here. The 13 September 50 ft was exactly this.
        //        7. A CONTACT'S hae WAS DIFFERENCED AGAINST MSL — FIXED. The aircraft's receiver
        //           reports both hae and msl; their difference is the geoid separation N it
        //           applies (about +12 m here), latched into TakBridgeHolder and logged once. A
        //           non-ground contact's hae is brought into the DTED frame through it. The
        //           aircraft's raw GPS height drifted 309 m to 188 m in the first minute of the
        //           21:25 flight; N is untouched by that, both altitudes come from one solution.
        //        ElevationPolicy.kt holds all three rules, pinned by ElevationPolicyTest.
        //        ⚠ STILL OPEN: (6) magnetometer bias 0.9–6° by heading. (8) telemetry leads
        //        video; DTED file seeks per contact per frame on the UI thread. (9) gimbal roll
        //        unread. ⚠ ADS-B: an ADS-B gateway's hae is usually PRESSURE altitude (29.92 in
        //        standard day), not geometric height — off by the day's altimeter setting,
        //        hundreds of feet either way, on top of the geoid. Fix 7 removes the geoid part
        //        only; the pressure part needs the local QNH and is not attempted.
        //
        //        "DEBUG LOG ON" IS A WARNING IN THE BANNER while file logging is on (operator,
        //        2026-09-15). The log costs the screen some jitter — accepted — but a pilot must
        //        be MADE to look and go and turn it off; a quiet HUD line was tried first the
        //        same day and was not a stimulus. Amber, behind every aircraft warning, shown
        //        with no aircraft, gone when off, AND THE ONE LINE THE ✕ DOES NOT CLOSE — the
        //        aircraft's lines close around it. Specification §4.8; the DJI trees owe it (D28).
        //        Also: the Explorer watchdog is no longer a toggle (always on), and the Debug
        //        screen's three log options sit under the log switch, greyed while it is off.
        //
        //        ✅ FLOWN 2026-09-15, 10:19 to 10:55, one aircraft, pin D042 on a utility box.
        //        Every AR fix of the 14th held in the air:
        //        - Fault 3, the projection: the pin stayed on the box at −12°, −16° with a 27°
        //          slew, −29°, −44°, and −58° with the pin 21° off the heading, never worse
        //          than about 2°. The old mapping would have put the last case OFF THE FRAME.
        //        - Faults 4/5/7: takeoff reference latched from "aircraft on the ground"
        //          (180.2 m MSL, the aircraft's own msl read 178–181), source TAKEOFF_REFERENCE,
        //          geoid 12–13 m against August's 12.2. The raw pair walked 10–16 m over the
        //          flight (whole metres, not the same instant) — smoothGeoid holds it.
        //        - Faults 1/2: thermal derived 26.7° vertical; PIP published 66.8°.
        //        - PiP registration held at 150 ft and at 400 ft, 58–66° down: road edges run
        //          straight across the window boundary, the pin sits on the thermal image of
        //          the box. The thermal window sits about 1° left and 2° above the visible
        //          axis — that is the thermal lens's boresight, and the crosshair is correctly
        //          the VISIBLE axis. In full thermal the crosshair is therefore 1–2° off the
        //          visible aim; a per-lens aim offset can take it, once measured at range.
        //        - The switch time is the CAMERA'S: 1.8 s visible↔PiP, 0.6 + 1.1 s to thermal,
        //          IDENTICAL with the record format matched at 720p25 (bench, same morning).
        //          Matching formats does not help; 1080p stays. Do not try again.
        //        - The banner: AT ALTITUDE LIMIT closed by the pilot at 10:53:41, DEBUG LOG ON
        //          stayed with no ✕. 15 video stalls, no crash, no cancel used, no recording.
        //        THE TAP IS A TWO-WAY VISIBLE↔PIP TOGGLE (operator, 2026-09-15, after the
        //        flight: three steps were "a chore"). Full thermal is reached from ⤢ on the PIP
        //        window's lower-left corner (top-right sat under the EV slider), the phone idiom; ⤡ goes back;
        //        a pill tap from full thermal goes back to PIP. The pill reads PIP unlit in
        //        visible and PIP lit in PIP and in full thermal alike (operator). The window's corner is MEASURED, not derived from
        //        the FOV ratio (PipWindowGeometry: 0.40 x 0.607 of the frame, 0.6 % left and
        //        3.6 % up — the thermal lens's boresight). The control is a 30dp glyph on a
        //        PILL in the actions column directly under the PIP pill, shown only while thermal
        //        is on screen — five placements on the picture were tried and rejected the
        //        same day. Checked on the controller, not yet flown.
        //
        //        ⚠ ADS-B, MEASURED 2026-09-15 11:39 with the real aircraft in frame at 2x:
        //        N378PA at 2.64 km, marker drawn 3.3° BEHIND the aircraft along its track and
        //        0.9° low. The horizontal part is LATENCY — the marker was walking across the
        //        frame at ~60 px/s and the aircraft was ahead of it; an ADS-B report is a
        //        second or two old through the gateway and the server, 60–120 m at that
        //        range. Fix when wanted: dead-reckon the marker forward along its reported
        //        course and speed by the report's age (the CoT carries time). The vertical
        //        0.9° is ~40 m, within the pressure-altitude question. The geoid part is gone.
        //        STORED, NOT ACTED ON (operator).
        //
        //        THE ACTIONS CAPSULE IS A VERTICAL COLUMN ON THE LEFT (operator, 2026-09-15):
        //        the bar across the top was hard to reach. Same seven controls, same order
        //        top to bottom, every pill 66dp wide (one width; the two-width rule is spent
        //        for a column), 18dp gaps against accidental taps, under the status capsule;
        //        the warning banner starts right of it. The band keeps flightToolbar and now
        //        reports the status capsule's height alone as the chrome inset. Specification
        //        §4.2; the DJI trees owe it (D29). ⚠ OPEN: the obstacle view's left-edge label
        //        sits under the column's foot — it needs a LEFT inset like its top one.
        //        The obstacle view has the LEFT inset now (setLeftInset, the column's right edge).
        //        RTH heads the column as a pill (operator: it is a tool, not a status).
        //        Then (same day): the column's pills are 42dp high (a quarter more), the HUD
        //        column's top padding is 10dp so the EV slider through the gimbal readout move
        //        up into the freed space, and the WARNING BANNER IS AT THE BOTTOM-LEFT AND
        //        OPENS UPWARD, ▴ collapsed, ▾ under the open list.
        //
        //        ⚠ STORED FOR LATER (operator, 2026-09-15 11:41): switching between photo and
        //        video with the HARDWARE buttons gave an error on screen. The log:
        //        11:41:13 hardware record pressed in SINGLE — the app takes the press as a
        //        mode change and starts the recording after 2000 ms; 11:41:15 startRecordVideo
        //        failed: "Needs the recording mode to record videos". So the 2 s wait was not
        //        enough for the camera to reach RECORD, or the press did not change the mode at
        //        all. Same at 11:42:14. The zoom restore fired both times. Also seen: the
        //        "spurious SDK photo-failure callback" 3–49 ms after a named PHOTO_TAKEN_DONE,
        //        ignored correctly. Logs kept under flight-logs/2026-09-15/. Not diagnosed.
        //        ⚠ "TAKING A PHOTO LOCKS UP THE FPV" (operator) — THE LOG SHOWS WHY: the
        //        downlink STOPS while the camera is in photo mode. Frame monitor: a 14,659 ms
        //        freeze from the first shutter press at 11:41:03 until the recording started
        //        at 11:41:17, and a 41,209 ms freeze from 11:41:35 until record mode came back
        //        at 11:42:16. Every shutter press in between was taken blind. It is the CAMERA
        //        holding the live stream while in SINGLE; the picture returns the moment the
        //        camera is back in RECORD. Candidate fix: after a confirmed PHOTO_TAKEN_DONE
        //        put the camera back to VIDEO (the spec's "no application drives the media
        //        mode" note is about not GUESSING the mode; returning to video after a still is
        //        a different thing), or at least a §4.8 notice that the picture is held. Not
        //        built; stored (operator, 2026-09-15).
        //
        //        ⚠ CANCEL LANDING IS REMOVED (operator, 2026-09-14). The v2.1.4 RTH long-press
        //        menu offered it beside Cancel Return; the first flight to try it (21:30) asked
        //        twice, cancelLand was accepted twice, and the aircraft was still LANDING 1.5 s
        //        later both times. CANCEL RETURN WORKED on the same flight (21:27, NORMAL_GO_HOME,
        //        accepted, out of the return within 1.5 s) and stays. Both v2.1.4 items are now
        //        flown.
        //        ⚠ THE RF POWER WRITE IS REMOVED (operator, 2026-09-14): "it's an Autel limit".
        //        Every path was refused since August; the connect-time write only put a failure
        //        in the log. Do not open it again.
        versionCode 94
        versionName "2.2.0"
        multiDexEnabled true
        signingConfig signingConfigs.config
        ndkVersion '21.4.7075529' // ���� NDK �汾

        // Shown on the home screen (under the app name) so a controller in the field can always
        // be identified precisely — which matters given how many builds get sideloaded during a
        // debugging session. Computed at BUILD time, not install time, so it survives an
        // `install -r` that keeps the same APK.
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\""
    }
    buildTypes {
        release {
            project.ext.set("archivesBaseName", "TAKPilot2-Autel_" + defaultConfig.versionName)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            project.ext.set("archivesBaseName", "TAKPilot2-Autel_" + defaultConfig.versionName)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    lintOptions {
        abortOnError false
    }
    // Unit tests (v1.6.0). returnDefaultValues lets pure-logic tests run code that touches
    // android.util.Log (AppLog forwards there) without a device or a mock framework.
    testOptions {
        unitTests.returnDefaultValues = true
    }
    productFlavors {
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
//    mavenCentral()
//    google()
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Unit tests for the pure-logic core (v1.6.0) — warnings policy, flight-record formats,
    // CoT XML, unit conversions. See app/src/test.
    testImplementation 'junit:junit:4.13.2'
    //    testCompile 'junit:junit:4.12'
    //*
    //implementation project(':sdk')

    // NOT the vendor aar -- a PATCHED copy of it. autel-sdk-release.aar sits beside this one,
    // pristine and committed, and is still the source of truth; the -xl726 variant is generated
    // from it by buildsystem/patch-autel-sdk-camera-id.py.
    //
    // The patch repoints one camera-model alias (XL719 -> XL726) so this SDK can identify the
    // EVO II 640T V3's camera at all. Without it the SDK reports CameraProduct.UNKNOWN, hands
    // back a placeholder UnknownCamera, and EVERY camera command fails. No published Autel SDK
    // knows XL726 -- all three of their public repos were checked. Full reasoning, the evidence,
    // and the "genuine XL719 hardware no longer works" caveat are at the top of that script.
    //
    // Regenerate after any change to the vendor aar:  python3 buildsystem/patch-autel-sdk-camera-id.py
    implementation(name: "autel-sdk-release-xl726", ext: "aar")

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.20"
    //noinspection GradleCompatible
//    implementation 'com.android.support:appcompat-v7:25.3.1'
    implementation  'com.google.android.gms:play-services-maps:17.0.1'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.android.support:multidex:1.0.3'
    //noinspection GradleCompatible
    implementation 'com.android.support:recyclerview-v7:25.3.1'

    implementation 'androidx.appcompat:appcompat:1.0.0'


    implementation('com.squareup.okhttp3:okhttp:4.7.2')

    // --- TAKPilot2-Autel additions ---
    // RTSP push client (raw H.264 injection, no re-encode) — era-matched with AGP 7.2/Kotlin 1.7
    implementation 'com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtsp:2.2.6'
    // THE SRT PUSH CLIENT IS NOT A DEPENDENCY. It is VENDORED SOURCE in app/src/main/java/
    // com/pedro/srt and com/pedro/common, taken from RootEncoder 2.4.7 (Apache 2.0) — see
    // NOTICE.md.
    //
    // It cannot be a dependency. The same author publishes an `srt` module, but every
    // published version is compiled by Kotlin 1.9 or 2.0, and this project compiles with
    // Kotlin 1.7.20. A 1.7 compiler refuses to read 1.9 metadata, thus the aar does not
    // build here. The alternative was to move the whole application to Kotlin 1.9, which is
    // a large change to a build that flies on a fleet. The source is 4400 lines, it uses
    // only the Android SDK and coroutines, and it needed one change to compile (an enum
    // `.entries` call, a Kotlin 1.9 idiom). Vendoring is the smaller risk, and the DJI v5
    // sibling already vendors this author's RTSP client for the same class of reason.
    //
    // Coroutines is a NEW dependency of this application and the vendored SRT code is its
    // only user. 1.6.4 is the last release that Kotlin 1.7.20 can read.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    // Flight-map (OSM tiles, offline-cacheable) for TAK markers / drop pins
    implementation 'org.osmdroid:osmdroid-android:6.1.14'
    // Imported-DTED region tracking (terrain-corrected SPoI) — ported from the DJI sibling
    // app. DJI pins 2.2.6 there because its Kotlin 1.5.10 can't read newer Room's metadata;
    // this project is on Kotlin 1.7.20, so a more current Room release is fine.
    implementation "androidx.room:room-runtime:2.4.3"
    kapt "androidx.room:room-compiler:2.4.3"
    // --- Autel SDK transitive dependencies ---
    // autel-sdk-release.aar is a LOCAL file dependency, so Gradle resolves NOTHING transitively
    // for it — everything the SDK needs at runtime has to be declared here by hand. These four
    // were commented out at some point and the app crashed on the FIRST AIRCRAFT CONNECT with
    // NoClassDefFoundError: io.reactivex.Observable (2026-08-02).
    //
    // Nothing in the app's own code touches them, and no UI path reaches them, which is why it
    // ran fine for weeks: the trigger is SDKInitHelper.initProduct -> CameraManager.init, which
    // only happens once an aircraft is talking to the controller.
    //
    // Counts are classes inside the aar referencing each package — measured, not assumed.
    // Versions are the ones Autel's own sample declared, i.e. what the SDK was built against.
    implementation 'io.reactivex.rxjava2:rxjava:2.1.2'          // 829 classes reference it
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'       // 1
    implementation 'org.greenrobot:eventbus:3.0.0'              // 3
    // okhttp3 (33) and gson (46) are also referenced and already declared above.
    //
    // commons-codec is deliberately NOT declared, despite also being referenced: the aar
    // SHIPS it in its own internal libs/ (alongside httpclient-4.2.5 and httpcore-4.2.4), so
    // adding the Maven artifact fails the build with duplicate-class errors. "Referenced by
    // the aar" and "missing from the build" are different questions — check the aar's libs/
    // before adding anything here.

    implementation 'com.google.code.gson:gson:2.8.7'
//    api "androidx.annotation:annotation:1.0.0"
}

