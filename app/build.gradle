apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    signingConfigs {
        config {
            keyAlias 'android'
            keyPassword 'android'
            storeFile file('../platform.keystore')
            storePassword 'android'
        }
    }
    compileSdkVersion 33
//    buildToolsVersion '28.0.3'

    packagingOptions {
//        pickFirst 'lib/armeabi-v7a/libwhitename.so'
//        pickFirst 'lib/arm64-v8a/libwhitename.so'
//        pickFirst 'lib/armeabi-v7a/libAutelUtil.so'
//        pickFirst 'lib/arm64-v8a/libAutelUtil.so'
    }
    defaultConfig {
        applicationId "com.tak.uastoollite"
        minSdkVersion 21
        targetSdkVersion 29
        // TAKPilot2-Autel's own version, replacing the stock Autel sample's "V1.0.1.40" this
        // project was forked from. v1.3 is the first build carrying DJI-MSDKv4 UI/feature
        // parity; v1.2 (tag autel-baseline-v1.2) was the older port that predated it.
        //
        // versionName is real semver (MAJOR.MINOR.PATCH), not cosmetic: TestApplication reads
        // it via PackageManager and reports it as <takv version> on every PLI, so this is what a
        // TAK server's Connected Users panel shows for this client. versionCode is a SEPARATE,
        // purely internal Android integer with no semver meaning -- it exists only so
        // `install -r` can tell a build is newer, and it is deliberately NOT shown anywhere in
        // the UI (BuildConfig.BUILD_TIME identifies an exact build far more precisely). Bump
        // versionName when what's on the wire changes; bump versionCode on every build regardless.
        //
        // 1.4.0: fixes the unbounded ADS-B contact-retention bug (see CotParser) that was
        //        causing app-process OOM kills in busy airspace; adds the debug resource-monitor
        //        overlay; moves TAK status to the ENTER FLIGHT card.
        // 1.4.1: reverts ScreenCaptureEncoder to the hardware HEVC encoder -- the software one
        //        (PREFER_SOFTWARE_ENCODER, set 2026-08-02) leaks system memory via the
        //        out-of-process media.swcodec service while streaming, and was a likely
        //        contributor to the same night's OOM kills. (Never tagged/released on its own --
        //        1.4.2 is the first build to actually ship it.)
        // 1.4.2: Apply to Aircraft gets a progress bar + countdown instead of a frozen-looking
        //        11s wait, button disabled for the duration. Resource-monitor overlay grows CPU
        //        (system + app) and GPU (Adreno busy%/clock), flattens to one line pixel-aligned
        //        to the mini-map, and now also reaches the debug log (not just the screen) every
        //        ~2s -- the media.swcodec and CotParser leaks above were both actually diagnosed
        //        from log data, not by watching the screen live. Smart Controller V3-specific
        //        sizing: readout text and the crosshair (arms + accuracy ring) bumped up for that
        //        screen's real size, HUD split top/bottom to clear the obstacle-radar labels.
        // 1.5.0: kills the 2s keyframe pulse in the outgoing stream for good. Root cause was not
        //        bitrate: the hardware HEVC encoder declares VBR only (probe: VBR=true CBR=false)
        //        and we were requesting CBR, so IDRs got quantised down to fit a per-frame
        //        budget. Asking for VBR took the I/P frame-size ratio 2.53x -> 14x at the same
        //        average bitrate. The bitrates that had been doubled to paper over it are rolled
        //        back (STANDARD 1.6M->800k, HIGH 3.6M->1.8M, LOW 475k->375k), so this build
        //        SHRINKS what goes on the wire while looking better. New: long-press LIVE for the
        //        quality tier, which now applies instantly by reusing the MediaProjection instead
        //        of re-prompting for screen capture.
        // 1.5.1: Pre-Flight restructured to fit one screen without scrolling, sections ordered
        //        by how often they are used, and the helper prose stripped -- it is a parameter
        //        screen, not a field guide. New: Battery Warning/Critical fields, with the
        //        flight-screen gauge and the ENTER FLIGHT card now banded and read from the
        //        AIRCRAFT rather than from the saved preference. Control response is applied on
        //        every connect (clean slate over whatever Explorer left) and its yaw handling is
        //        corrected: the app had been writing the EXP stick curve while believing it was
        //        a rate, and the SDK silently clamped it, so Precision yaw was never actually
        //        slower. Precision now also softens the throttle/pitch/roll curves.
        // 1.5.2: AR field-of-view model corrected. The vertical FOV is no longer a second
        //        independent calibration knob -- for a rectilinear lens it is rigidly coupled to
        //        the horizontal by the video frame's aspect ratio, and two free knobs had been
        //        tuned into a combination no real camera can have. The shipped default 79x62
        //        implied an aspect of 1.372 against a 1.778 stream (23% out) because the 79 was
        //        Autel's DIAGONAL spec used as a horizontal; the field-calibrated 64.5x36.5
        //        implied 1.913 (7.6% out). Vertical is now derived from the horizontal and the
        //        LIVE frame aspect, so it is always consistent and a camera mode change (16:9
        //        video / 4:3 photo / 5:4 IR) re-derives it with no recalibration. EO default
        //        corrected 79 -> 66.8 (the diagonal converted properly). This changes <sensor
        //        fov/vfov> on the wire. Also: activeLens is finally wired, so thermal publishes
        //        and projects at the IR field of view instead of the EO one; AR edge arrows use
        //        the same tangent normalisation as the marker projection so they stop pointing
        //        slightly off.
        //
        //        THE CAMERA NOW SUPPLIES THE FOV. XT706CameraInfo.getHorizontalFOV/getVerticalFOV
        //        are real telemetry in degrees, verified against the aircraft at 65.8x39.9 with an
        //        implied aspect of 1.782 against a 1.778 stream. That value is used in preference
        //        to any constant, follows a lens change on its own (thermal reports 33.0, so the
        //        old IR_HFOV=42.0 was 9 degrees out), and retires hand calibration. The constants
        //        remain only as a fallback until the camera's first status push.
        //
        //        ZOOM IS ABSOLUTE, NOT RELATIVE. applyZoom multiplied a baseline read once at
        //        connect, which assumed the camera always connects at 1x; reconnecting while
        //        zoomed banked the zoomed value as "1X" and no level was what it claimed
        //        (observed at a true 4x -- "1X" returned to 4x, "4X" drove to 16x). The raw units
        //        are hundredths (100 = 1.0x, established from focalLength tracking zoomScale
        //        linearly), so levels are now set absolutely and the live ratio comes from the
        //        camera. zoomBaseRaw is diagnostic-only.
        //
        //        GROUND CONTACTS USE TERRAIN FOR ALTITUDE. Subtracting the aircraft's MSL from a
        //        contact's ellipsoidal `hae` carried the geoid separation -- measured at 12.2 m,
        //        which put icons 2.3 degrees high. Contacts whose CoT type is GROUND now use DTED
        //        under them; everything else keeps its reported altitude.
        //
        //        AR ACCURACY IS NOW STATED WHERE IT IS USED. Aiming at one target from three
        //        headings gave bearing errors of 1 to 6 degrees (up to 27 m at 350 m), caused by
        //        heading-dependent magnetometer error on the aircraft that no fixed offset can
        //        remove. The AR menu and the Field Guide both say the overlay is for general
        //        awareness of an area and not for an exact point, and the AR menu links straight
        //        to that section of the guide.
        //
        //        FLIGHT SCREEN: HUD readouts sit on translucent panels so they stay legible over
        //        bright ground; AGL and MSL each get their own line so a wrap cannot separate a
        //        number from its unit; HOME distance moves to the RTH group; gimbal pitch moves
        //        under the aircraft position; the clock matches the rest of the HUD. The AR
        //        overlay draws semi-transparent. The obstacle radar's TOP face was drawing under
        //        the toolbar and could not be read -- it now clears it.
        // 1.5.3: Markers that other users share now stay. Before this, a marker was removed after
        //        approximately 10 minutes. CloudTAK sends a marker with a stale time only 3.6
        //        SECONDS after its start time. The parser increased that to 5 minutes, and the
        //        stale sweep then deleted the marker 5 minutes later. The sweep had no test of the
        //        CoT type and no test of the `archived` marker, so it removed shared markers, team
        //        positions and ADS-B tracks in the same way.
        //
        //        A MARKER IS NOW IDENTIFIED BY THE `archived` MARKER ON THE WIRE. A capture of 605
        //        inbound events on the live net gave this: 552 ADS-B aircraft, 31 CloudTAK users,
        //        10 ADS-B ground vehicles and 2 team positions all had archived=false. Only the 2
        //        placed markers had archived=true, and they came from two different clients.
        //        Therefore `archived` is necessary. A test of the CoT type alone cannot do this
        //        work: CloudTAK sends its own users as `a-f-G-E-V-C`, which each type rule reads as
        //        a marker. Air tracks, position reports and sensor points are refused before the
        //        `archived` test, so a sender cannot make one of them permanent.
        //
        //        METAR WEATHER STATIONS ARE REMOVED AT THE PARSER. A TAKPilot pilot cannot use
        //        them: their content is in <remarks>, which this application does not show. They
        //        were also kept on the disk -- 136 of the 155 saved entries were weather stations.
        //        The application now removes them when they arrive, removes the entries that
        //        earlier builds saved, and the Weather control is deleted from the AR menu.
        //
        //        THE SAVED-MARKER STORE HAS A LIMIT. It had no limit, no age and no removal. Each
        //        marker now has a `lastSeen` time. The application removes a marker after 72 hours
        //        with no update, and it keeps a maximum of 1000. Entries that an earlier build
        //        saved are tested again, because that build also saved platforms and live clients.
        //
        //        A NEW LINE IN THE LOG REPORTS THE NUMBER OF CONTACTS HELD, every 30 seconds. This
        //        is the number that was 161 when the application was stopped for memory in the air
        //        on 2026-08-03. A slow increase in it is now visible before it becomes a failure.
        //
        //        Also: an explicit delete from the network (`t-x-d-d`) removes a marker from the
        //        disk as well as from the screen. A marker that comes back from the disk is put
        //        into the live contact list, so the AR overlay can see it.
        // 1.5.4: The Map Display section of Pre-Flight Setup is removed (operator's decision).
        //        It selected the tile source and downloaded an area before a flight. The small
        //        map is now OpenStreetMap only.
        //
        //        ⚠ THEREFORE A FIRST FLIGHT INTO NEW GROUND WITH NO CONNECTION HAS NO MAP. The
        //        application still keeps each tile that it shows, so an area flown one time with
        //        a connection is on the controller. It cannot get ground that it has not shown.
        //        A person can no longer delete the tile cache from the screen; osmdroid removes
        //        the oldest tiles itself when the store passes 2 GB.
        //
        //        THE SMALL MAP GETS TWO TIMES LARGER WHEN YOU TOUCH IT TWO TIMES. Touch it two
        //        times again to make it small. It covers a part of the video and the data at the
        //        right side. It is always small when the flight screen opens. The zoom does not
        //        change, so the larger map shows four times more ground.
        //
        //        Zoom: WIDE 13 -> 15.5, NEAR 17 -> 18. ⚠ At WIDE the home point leaves the map
        //        before the aircraft is at its distance limit (the view holds approximately
        //        293 m; the limit is 488 m). The larger map holds approximately 586 m, which is
        //        past the limit. The HOME distance and direction in the HUD stay correct at each
        //        distance. Also note 15.5 is between two tile levels, so it is softer than 15 or
        //        16 — tiles exist at whole numbers only.
        //
        //        Symbols on the map are smaller: markers 32 -> 14 dp, team positions 14 -> 10 dp,
        //        air traffic 18 -> 12 dp, labels 10 -> 8. The map is 180 dp wide, so a 32 dp
        //        marker with its label was 29 % of its height. The WIDE change also made the
        //        symbols four times more dense.
        //
        //        MARKERS THAT THE TEAM SHARED ARE NOW IN THE MARKER LIST, with the markers that
        //        the pilot dropped. A shared marker gives a local delete only: to move, rename or
        //        send it again would change that marker on each other client.
        //
        //        CLEAR ALL IS RED AND REMOVES BOTH SETS. It removed only the pilot's own markers
        //        before, which left a "cleared" map that still had each shared marker on it. It
        //        gives the two counts before the pilot confirms. A shared marker is not put in
        //        the permanently-hidden set: a bulk clear must not make the pilot blind to those
        //        identities for the life of the installation.
        //
        //        Also: a local delete of a shared marker now removes it from the live contact
        //        map as well. The hidden set stopped it being drawn, but a marker is exempt from
        //        the stale sweep, so it stayed in memory for the life of the process.
        // 1.5.5: THE VIDEO PASSWORD IS NOW SENT IN THE CoT. Pre-Flight Setup read each video
        //        value from the store when the screen opened, but it did not read the password.
        //        A listener then saved the values on the screen. Thus the empty box wrote over
        //        the stored password, and the password erased itself each time the screen
        //        opened. The URL in the CoT had no password, and viewers could not see the video.
        //        ⚠ THE OLD FAULT ERASED THE STORED PASSWORD. Type it one more time.
        //        The URL on the screen now shows "(NO PASSWORD)" when the box is empty. It
        //        showed three stars at all times before, which hid this fault.
        //
        //        THE PILOT NOW HAS A POSITION MARKER. The application sent a position for the
        //        aircraft only. The operator marker was one message at connection with the
        //        position 0, 0, and nothing replaced it. The controller position is read from
        //        its own receiver and sent every two seconds. The marker has the callsign
        //        "<callsign>-Pilot", the colour cyan, and the controller battery level.
        //        The video is on this marker as well as on the aircraft. The screen recording
        //        continues when the aircraft is off, but the aircraft marker stops without a
        //        position. Thus a video on the aircraft marker only was not available in the
        //        condition that the screen recording exists to correct.
        //        The pilot marker has no camera direction and no sensor point. Those are
        //        aircraft data.
        //
        //        THE PILOT SELECTS THE VIDEO CODEC. Pre-Flight Setup has H.264 and H.265 below
        //        the video quality. H.264 is the most compatible and is the default. H.265 is
        //        more efficient and gives a better picture for the bandwidth, but fewer clients
        //        can show it. ⚠ A client that cannot decode H.265 fails at a level that does not
        //        mention video, and the controller shows no fault: the data rate and the frame
        //        count stay correct. If viewers report a fault that this end does not show,
        //        examine the codec first. The codec applies when the video starts, thus stop the
        //        video and start it again after a change.
        //
        //        THE AIRCRAFT NOW REPORTS ITS TRUE IDENTITY. The aircraft data in the CoT gave
        //        the type "DJIV5" and the camera "M30T", which came from the build that this
        //        application was ported from. An Autel aircraft told each client that it was a
        //        different manufacturer's aircraft with a different camera. The values are now
        //        "AUTEL" and "EVO2".
        // 1.5.6: PROTECTED SETTINGS NEED A PASSWORD. Pre-Flight Setup has a third lock, on the
        //        two battery levels. To remove any of the three locks (TAK server, video
        //        server, battery levels), the user must type the password. The password is
        //        fixed in the application and is a barrier against accidental changes only —
        //        it is not security. Setting a lock needs no password.
        //
        //        Corrections from the code review of 1.5.5:
        //        - The controller GPS receiver now stops when the TAK session stops. It stayed
        //          on for the life of the process before, which used the controller battery.
        //        - A position from the system cache is used only when it is less than ten
        //          minutes old. An old position could show the pilot at a wrong location.
        //        - The controller battery is read each 30 seconds, not each 2 seconds. When a
        //          read fails, the last good value is sent, not 100 — a failed read must not
        //          show a full battery.
        // 1.5.7: THE RC SIGNAL SURVIVES A TAK TOGGLE. A stop and start of the TAK session made
        //        the RC signal indicator gray for the life of the process. Cause: an asymmetry
        //        in the Autel SDK — the removal of the last RC info listener detaches the SDK
        //        from the RC status packets, and a new registration does not attach it again.
        //        The application no longer removes that listener; see AutelTakBridge.unsubscribe.
        //
        //        The video lock now also covers the codec (H.264/H.265) and the TCP transport
        //        toggle. The quality profile stays live — a pilot must be able to drop to Low
        //        on a marginal link without a password.
        // 1.5.8: THE RIGHT SCROLL WHEEL ADJUSTS THE ZOOM. Hold it clockwise to zoom in and
        //        counterclockwise to zoom out. The zoom moves continuously at the rate of the
        //        stock Autel app — about five seconds from 1x to 16x. The zoom pill shows the
        //        values between the steps, such as "2.4X". The pill, its long press and the C1
        //        button keep their stepped behaviour.
        //
        //        RECORDING FAILURES NOW REPORT THEIR CAUSE. The camera can record to its
        //        internal memory instead of the SD card. When that memory is full, the record
        //        command failed inside the SDK and the application showed nothing at all. The
        //        application now registers the flash-card listener at each camera connect,
        //        which is what makes the SDK report the true cause, and it starts its record
        //        watchdog BEFORE the command, thus a failure in the command cannot stop the
        //        watchdog. The Enter Flight card shows where the camera writes and how much
        //        space is free.
        versionCode 15
        versionName "1.5.9"
        multiDexEnabled true
        signingConfig signingConfigs.config
        ndkVersion '21.4.7075529' // ���� NDK �汾

        // Shown on the home screen (under the app name) so a controller in the field can always
        // be identified precisely — which matters given how many builds get sideloaded during a
        // debugging session. Computed at BUILD time, not install time, so it survives an
        // `install -r` that keeps the same APK.
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\""
    }
    buildTypes {
        release {
            project.ext.set("archivesBaseName", "TAKPilot2-Autel_" + defaultConfig.versionName)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            project.ext.set("archivesBaseName", "TAKPilot2-Autel_" + defaultConfig.versionName)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    lintOptions {
        abortOnError false
    }
    productFlavors {
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
//    mavenCentral()
//    google()
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //    testCompile 'junit:junit:4.12'
    //*
    //implementation project(':sdk')

    // NOT the vendor aar -- a PATCHED copy of it. autel-sdk-release.aar sits beside this one,
    // pristine and committed, and is still the source of truth; the -xl726 variant is generated
    // from it by buildsystem/patch-autel-sdk-camera-id.py.
    //
    // The patch repoints one camera-model alias (XL719 -> XL726) so this SDK can identify the
    // EVO II 640T V3's camera at all. Without it the SDK reports CameraProduct.UNKNOWN, hands
    // back a placeholder UnknownCamera, and EVERY camera command fails. No published Autel SDK
    // knows XL726 -- all three of their public repos were checked. Full reasoning, the evidence,
    // and the "genuine XL719 hardware no longer works" caveat are at the top of that script.
    //
    // Regenerate after any change to the vendor aar:  python3 buildsystem/patch-autel-sdk-camera-id.py
    implementation(name: "autel-sdk-release-xl726", ext: "aar")

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.20"
    //noinspection GradleCompatible
//    implementation 'com.android.support:appcompat-v7:25.3.1'
    implementation  'com.google.android.gms:play-services-maps:17.0.1'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.android.support:multidex:1.0.3'
    //noinspection GradleCompatible
    implementation 'com.android.support:recyclerview-v7:25.3.1'

    implementation 'androidx.appcompat:appcompat:1.0.0'


    implementation('com.squareup.okhttp3:okhttp:4.7.2')

    // --- TAKPilot2-Autel additions ---
    // RTSP push client (raw H.264 injection, no re-encode) — era-matched with AGP 7.2/Kotlin 1.7
    implementation 'com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtsp:2.2.6'
    // Flight-map (OSM tiles, offline-cacheable) for TAK markers / drop pins
    implementation 'org.osmdroid:osmdroid-android:6.1.14'
    // Imported-DTED region tracking (terrain-corrected SPoI) — ported from the DJI sibling
    // app. DJI pins 2.2.6 there because its Kotlin 1.5.10 can't read newer Room's metadata;
    // this project is on Kotlin 1.7.20, so a more current Room release is fine.
    implementation "androidx.room:room-runtime:2.4.3"
    kapt "androidx.room:room-compiler:2.4.3"
    // --- Autel SDK transitive dependencies ---
    // autel-sdk-release.aar is a LOCAL file dependency, so Gradle resolves NOTHING transitively
    // for it — everything the SDK needs at runtime has to be declared here by hand. These four
    // were commented out at some point and the app crashed on the FIRST AIRCRAFT CONNECT with
    // NoClassDefFoundError: io.reactivex.Observable (2026-08-02).
    //
    // Nothing in the app's own code touches them, and no UI path reaches them, which is why it
    // ran fine for weeks: the trigger is SDKInitHelper.initProduct -> CameraManager.init, which
    // only happens once an aircraft is talking to the controller.
    //
    // Counts are classes inside the aar referencing each package — measured, not assumed.
    // Versions are the ones Autel's own sample declared, i.e. what the SDK was built against.
    implementation 'io.reactivex.rxjava2:rxjava:2.1.2'          // 829 classes reference it
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'       // 1
    implementation 'org.greenrobot:eventbus:3.0.0'              // 3
    // okhttp3 (33) and gson (46) are also referenced and already declared above.
    //
    // commons-codec is deliberately NOT declared, despite also being referenced: the aar
    // SHIPS it in its own internal libs/ (alongside httpclient-4.2.5 and httpcore-4.2.4), so
    // adding the Maven artifact fails the build with duplicate-class errors. "Referenced by
    // the aar" and "missing from the build" are different questions — check the aar's libs/
    // before adding anything here.

    implementation 'com.google.code.gson:gson:2.8.7'
//    api "androidx.annotation:annotation:1.0.0"
}

