        // v2.1.7 — 2026-09-14. THE CARD RECORDINGS ARE 1080p30 H.265. A 12.5-hour mission left
        //        huge files, because the camera kept whatever Autel Explorer put it in and this
        //        airframe goes to 7680x4320. 1080p is about a quarter of 4K's pixels.
        //        ⚠ CORRECTED 2026-09-14, BY MEASUREMENT: THE CODEC SAVES NOTHING ON THIS CAMERA.
        //        This entry first said H.265 was "about half the bits of H.264, and the two
        //        multiply". Two files off the card say otherwise:
        //          MAX_0117  H.264 High  2720x1528p30  82 Mbps  = 19.7 Mbps per megapixel
        //          MAX_0139  H.265 Main  1920x1080p30  46 Mbps  = 22.2 Mbps per megapixel
        //        The camera picks its bitrate from the RESOLUTION and ignores the codec — H.265
        //        even costs slightly more per pixel here. The whole 82 -> 46 drop came from the
        //        resolution. H.265 is a better picture at the same size, which is worth having,
        //        but it is NOT a size lever. The ladder is near enough linear in pixel count, so
        //        1280x720 would land near 20 Mbps. Do not repeat the general claim about H.265
        //        for this airframe without re-measuring.
        //
        //        ⚠ THE BITRATE CANNOT BE SET. MEASURED ON THE CAMERA ITSELF, 2026-09-14, AND
        //        THIS IS SETTLED — do not spend another session on it. The camera's own JSON-RPC
        //        API is at http://192.168.1.11/camera and it REPORTS the whole encoder object:
        //          {"Encoding":"H265","Resolution":"1920x1080p30","Quality":50,"GovLength":30,
        //           "Profile":"High","BitrateType":"CBR","Bitrate":45000,"Slow":0}
        //        SetVideoEncoderConfiguration answers status 0 and honours ONLY Resolution and
        //        Encoding. Tried and silently discarded, each confirmed by read-back: Bitrate
        //        8000 (outside the advertised limit), Bitrate 3000 (INSIDE it), Quality 80,
        //        GovLength 60, BitrateType VBR. An unknown method answers status -1, so status 0
        //        is a real accept — the camera takes the call and drops the fields.
        //        Thus the SDK's three-field serialiser was MATCHING THE CAMERA, not being lazy,
        //        and reaching past the SDK gains nothing. GetVideoEncoderConfigurationOptions is
        //        a stub: all three streams return one boilerplate block that contradicts their
        //        own live values. GetRecordingSettings and GetVideoSourceConfiguration hold no
        //        rate control either.
        //
        //        ⚠ THE LADDER IS CBR AND PER-RESOLUTION. Read off the camera by setting each
        //        resolution and reading what it chose:
        //          1280x720p30    30000 kbps    13.5 GB/h
        //          1920x1080p30   45000 kbps    20.3 GB/h   <- what we ship
        //          2720x1528p30   80000 kbps    36.0 GB/h
        //          3840x2160p30  100000 kbps    45.0 GB/h
        //          3840x2160p60  100000 kbps
        //        Two consequences, both against the intuition:
        //        1. FRAME RATE IS NOT A LEVER. CBR means bits per second, thus 1080p24 writes
        //           exactly as many bytes per minute as 1080p30. Confirmed: asking for
        //           1920x1080p24 changed the resolution string and left Bitrate at 45000.
        //        2. 720p IS A BAD TRADE. It is 32.6 Mbps per megapixel against 1080p's 22.2 —
        //           half the linear resolution for a THIRD off the size. The earlier estimate
        //           of "near 20 Mbps" assumed the ladder was linear in pixels. It is not.
        //        Since the target is per-resolution and codec-independent, the codec changes
        //        NOTHING about the size. ⚠ THE OPERATOR CHOSE H.264 (2026-09-14): at 45 Mbps on
        //        1080p there is no visible difference left for H.265 to win, and H.264 opens
        //        everywhere — every player, every evidence system. See v2.1.9.
        //        Incidental: StreamId 1 is the downlink at 1280x720p30 H264 3000 kbps, already
        //        at the advertised 3000 ceiling.
        //
        //        ⚠ THE CAMERA CANNOT SEGMENT A RECORDING, measured 2026-09-14 while looking for
        //        a way to cap the file size. RecordingSettings.LoopRecordSettings.MaxRecordTime
        //        reads 3600 and REFUSES to change. That is not a syntax problem: EnableSubtitle
        //        was flipped 0 -> 1 in the SAME SetRecordingSettings request that MaxRecordTime
        //        ignored, so the method works and that one field is locked. The only way to cut
        //        a recording into pieces would be for the APPLICATION to stop and start it.
        //        Measured boundary for a stop+start: about 330 ms on a 21-second file. NOT
        //        measured on a large one, where finalising the file is the real cost.
        //        ⚠ THE WORK WAS DROPPED (operator, 2026-09-14): the 4 GB ceiling it was meant to
        //        stay under was a misreading of an uploader. The real limit is 1.5 TB and a
        //        13 GB sortie file is fine. Do not revive this without a NEW reason. If one ever
        //        comes up, the honest reason is blast radius — an MP4 is playable only once its
        //        index is written, so a power loss can cost the whole file rather than the last
        //        few seconds.
        //
        //        ⚠ THE CAMERA ANSWERS StartRecording WITH "status 0" WHEN NO CARD IS FITTED.
        //        Seen while testing with the card in a laptop. The application is already safe
        //        here — FlightActivity.startRecordVerified waits for the camera's own
        //        RECORD_START rather than the acknowledgement, retries once, and names the cause
        //        through recordFailureReason(), which covers "the SD card is not ready". NOT
        //        established: whether the camera pushes RECORD_START with no card. If it does,
        //        the REC pill would go red falsely. Test it on a day the card is already out.
        //        ⚠ THE LIVE TAK STREAM IS NOT TOUCHED. That is ScreenCaptureEncoder at 960x720
        //        H.264, and the standing decision to keep H.265 off the WIRE until every client
